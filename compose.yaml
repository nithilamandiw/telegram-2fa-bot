services:
  bot:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    volumes:
      - access-data:/opt/bot/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core:
        soft: 0
        hard: 0
    stop_grace_period: 30s
    logging:
      driver: none
volumes:
  access-data:
